<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Saya</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f4ff, #dff3e3);
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        main {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            border-radius: 10px;
            background-color: white;
            padding: 20px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
        }

        #inputArea {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        #noteTitle,
        #noteContent {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            flex: 1;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        #noteTitle:focus,
        #noteContent:focus {
            box-shadow: 0px 0px 10px rgba(76, 175, 80, 0.5);
        }

        #addNoteButton {
            padding: 12px;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #addNoteButton:hover {
            background-color: #45a049;
        }

        #notesContainer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            background-color: #f9f9f9;
            position: relative;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .note:hover {
            transform: translateY(-5px);
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        }

        .note h2 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #333;
        }

        .note p {
            margin: 0;
            font-size: 14px;
            color: #555;
        }

        .note .timestamp {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        .deleteButton {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: red;
            border: none;
            color: white;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }

        .deleteButton:hover {
            background-color: darkred;
        }

        .downloadButton {
            position: absolute;
            top: 10px;
            left: 10px;
            background-color: #3498db;
            border: none;
            color: white;
            padding: 5px 8px;
            cursor: pointer;
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }

        .downloadButton:hover {
            background-color: #2980b9;
        }

        footer {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <header>
        <h1>Catatan Saya</h1>
    </header>

    <main>
        <div id="inputArea">
            <input type="text" id="noteTitle" placeholder="Judul Catatan">
            <textarea id="noteContent" placeholder="Isi Catatan"></textarea>
            <button id="addNoteButton">Tambah Catatan</button>
        </div>
        <div id="notesContainer">
            <!-- Notes will be added here -->
        </div>
    </main>

    <footer>
        <p>Dibuat oleh Edy Sahputra</p>
    </footer>

    <script>
        const notesContainer = document.getElementById('notesContainer');
        const noteTitleInput = document.getElementById('noteTitle');
        const noteContentInput = document.getElementById('noteContent');
        const addNoteButton = document.getElementById('addNoteButton');

        let notesData = JSON.parse(localStorage.getItem('notes')) || [];

        function displayNotes() {
            notesContainer.innerHTML = '';
            notesData.forEach((note, index) => {
                const noteElement = document.createElement('div');
                noteElement.classList.add('note');

                const titleElement = document.createElement('h2');
                titleElement.innerText = note.title;
                noteElement.appendChild(titleElement);

                const contentElement = document.createElement('p');
                contentElement.innerText = note.content;
                noteElement.appendChild(contentElement);

                const timestampElement = document.createElement('div');
                timestampElement.classList.add('timestamp');
                timestampElement.innerText = `Ditambahkan pada: ${note.timestamp}`;
                noteElement.appendChild(timestampElement);

                const deleteButton = document.createElement('button');
                deleteButton.classList.add('deleteButton');
                deleteButton.innerText = 'Hapus';
                deleteButton.onclick = () => deleteNote(index);
                noteElement.appendChild(deleteButton);

                const downloadButton = document.createElement('button');
                downloadButton.classList.add('downloadButton');
                downloadButton.innerText = 'Unduh';
                downloadButton.onclick = () => downloadNoteAsImage(note); // Panggil fungsi unduh
                noteElement.appendChild(downloadButton);

                notesContainer.appendChild(noteElement);
            });
        }

        function deleteNote(index) {
            notesData.splice(index, 1);
            localStorage.setItem('notes', JSON.stringify(notesData));
            displayNotes();
        }

        function getCurrentTimestamp() {
            const now = new Date();
            return now.toLocaleString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        addNoteButton.addEventListener('click', () => {
            const title = noteTitleInput.value.trim();
            const content = noteContentInput.value.trim();
            const timestamp = getCurrentTimestamp();

            if (title !== "" && content !== "") {
                notesData.push({
                    title,
                    content,
                    timestamp
                });
                localStorage.setItem('notes', JSON.stringify(notesData));
                noteTitleInput.value = '';
                noteContentInput.value = '';
                displayNotes();
            } else {
                alert("Judul dan isi catatan tidak boleh kosong.");
            }
        });

        // Fungsi untuk mengunduh catatan sebagai gambar
        function downloadNoteAsImage(note) {
            // Buat elemen canvas
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');

            // Ukuran canvas (sesuaikan sesuai kebutuhan)
            canvas.width = 500;
            canvas.height = 300;

            // Warna latar belakang (opsional)
            context.fillStyle = '#fff';
            context.fillRect(0, 0, canvas.width, canvas.height);

            // Gaya teks
            context.font = '20px Arial';
            context.fillStyle = '#000';
            context.textAlign = 'center';

            // Tambahkan judul dan konten ke canvas
            context.fillText(note.title, canvas.width / 2, 50);
            context.font = '14px Arial';
            context.fillText(note.content, canvas.width / 2, 150);
            context.font = '10px Arial';
            context.fillText(note.timestamp, canvas.width / 2, 250);

            // Konversi canvas menjadi URL data
            const imageURL = canvas.toDataURL('image/jpeg');

            // Buat elemen tautan (a) untuk mengunduh gambar
            const downloadLink = document.createElement('a');
            downloadLink.href = imageURL;
            downloadLink.download = `${note.title}.jpg`; // Nama file
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }

        displayNotes();
    </script>

</body>

</html>
