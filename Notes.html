<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catatan Saya</title>
    <!-- PERBAIKAN: DITAMBAHKAN - Font Awesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #f0f4ff, #dff3e3);
        }

        header {
            background-color: #4CAF50;
            color: white;
            padding: 20px;
            width: 100%;
            text-align: center;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.2);
        }

        main {
            width: 90%;
            max-width: 600px;
            margin-top: 20px;
            border-radius: 10px;
            background-color: white;
            padding: 20px;
            box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.1);
        }

        #inputArea {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        #noteTitle,
        #noteContent {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            flex: 1;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        #noteTitle:focus,
        #noteContent:focus {
            box-shadow: 0px 0px 10px rgba(76, 175, 80, 0.5);
        }

        #addNoteButton {
            padding: 12px;
            background-color: #4CAF50;
            border: none;
            color: white;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        #addNoteButton:hover {
            background-color: #45a049;
        }

        #notesContainer {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .note {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            padding-right: 70px; /* Tambahan ruang untuk tombol di kanan */
            background-color: #f9f9f9;
            position: relative;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            cursor: default; /* Kursor default karena klik tidak lagi memicu edit */
        }

        .note:hover {
            transform: translateY(-3px);
            box-shadow: 0px 6px 12px rgba(0, 0, 0, 0.15);
            background-color: #e6ffe6;
        }
        
        .note.editing {
             border: 2px solid #007bff;
             background-color: #e6f7ff;
             box-shadow: 0px 0px 15px rgba(0, 123, 255, 0.5);
        }

        .note h2 {
            margin: 0 0 10px;
            font-size: 18px;
            color: #333;
        }

        .note p {
            margin: 0;
            font-size: 14px;
            color: #555;
        }

        .note .timestamp {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }

        /* PERBAIKAN: Mengubah tombol menjadi ikon dan mengatur posisi baru */
        .note button {
            border: none;
            color: white;
            padding: 8px; /* Lebih besar untuk ikon */
            cursor: pointer;
            border-radius: 50%; /* Membuat tombol bulat */
            line-height: 1; /* Agar ikon terpusat */
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            position: absolute; /* Posisikan secara absolut di dalam note */
        }
        
        .deleteButton {
            right: 10px;
            top: 10px;
            background-color: #dc3545; /* Merah untuk bahaya */
        }

        .deleteButton:hover {
            background-color: #c82333;
        }
        
        /* PERBAIKAN: Tombol Edit ditambahkan di samping Hapus */
        .editButton {
            right: 50px; /* Di sebelah tombol Hapus */
            top: 10px;
            background-color: #007bff; /* Biru untuk edit */
        }
        
        .editButton:hover {
            background-color: #0056b3;
        }

        .downloadButton {
            left: 10px;
            top: 10px;
            background-color: #3498db;
        }

        .downloadButton:hover {
            background-color: #2980b9;
        }

        footer {
            margin-top: 20px;
            padding: 10px;
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

    <header>
        <h1>Catatan Saya</h1>
    </header>

    <main>
        <div id="inputArea">
            <input type="text" id="noteTitle" placeholder="Judul Catatan">
            <textarea id="noteContent" placeholder="Isi Catatan"></textarea>
            <button id="addNoteButton">Tambah Catatan</button>
        </div>
        <div id="notesContainer">
            <!-- Notes will be added here -->
        </div>
    </main>

    <footer>
        <p>Dibuat oleh Edy Sahputra</p>
    </footer>

    <script>
        const notesContainer = document.getElementById('notesContainer');
        const noteTitleInput = document.getElementById('noteTitle');
        const noteContentInput = document.getElementById('noteContent');
        const addNoteButton = document.getElementById('addNoteButton');

        let notesData = JSON.parse(localStorage.getItem('notes')) || [];
        let editingIndex = -1; 
        
        // Fungsi ini dipanggil saat tombol edit diklik
        function editNote(index) {
            // Hapus kelas 'editing' dari semua catatan
            document.querySelectorAll('.note').forEach(n => n.classList.remove('editing'));
            
            editingIndex = index;
            const noteToEdit = notesData[index];

            // Muat data ke input
            noteTitleInput.value = noteToEdit.title;
            noteContentInput.value = noteToEdit.content;

            // Ubah teks tombol dan tambahkan kelas editing pada elemen catatan
            addNoteButton.textContent = 'Simpan Perubahan';
            notesContainer.children[index].classList.add('editing');
            
            // Gulir ke atas ke input area
            noteTitleInput.scrollIntoView({ behavior: 'smooth' });
        }
        
        function cancelEdit() {
            editingIndex = -1;
            noteTitleInput.value = '';
            noteContentInput.value = '';
            addNoteButton.textContent = 'Tambah Catatan';
            document.querySelectorAll('.note').forEach(n => n.classList.remove('editing'));
        }

        function displayNotes() {
            notesContainer.innerHTML = '';
            notesData.forEach((note, index) => {
                const noteElement = document.createElement('div');
                noteElement.classList.add('note');
                
                // Hapus event listener noteElement.onclick lama.
                // Pengeditan sekarang dipicu oleh tombol ikon Edit.

                // Jika sedang dalam mode edit, tambahkan kelas editing
                if (index === editingIndex) {
                    noteElement.classList.add('editing');
                }


                const titleElement = document.createElement('h2');
                titleElement.innerText = note.title;
                noteElement.appendChild(titleElement);

                const contentElement = document.createElement('p');
                contentElement.innerText = note.content;
                noteElement.appendChild(contentElement);

                const timestampElement = document.createElement('div');
                timestampElement.classList.add('timestamp');
                timestampElement.innerText = `Ditambahkan pada: ${note.timestamp}`;
                noteElement.appendChild(timestampElement);
                
                // PERBAIKAN: Tombol Edit (BARU)
                const editButton = document.createElement('button');
                editButton.classList.add('editButton');
                editButton.innerHTML = '<i class="fas fa-edit"></i>'; // Icon
                editButton.onclick = (e) => {
                    e.stopPropagation(); // Mencegah pemicuan klik elemen note (jika ada)
                    editNote(index);
                };
                noteElement.appendChild(editButton);

                // PERBAIKAN: Tombol Hapus (Menjadi Ikon)
                const deleteButton = document.createElement('button');
                deleteButton.classList.add('deleteButton');
                deleteButton.innerHTML = '<i class="fas fa-trash"></i>'; // Icon
                deleteButton.onclick = (e) => {
                    e.stopPropagation(); 
                    deleteNote(index);
                };
                noteElement.appendChild(deleteButton);

                // PERBAIKAN: Tombol Unduh (Menjadi Ikon)
                const downloadButton = document.createElement('button');
                downloadButton.classList.add('downloadButton');
                downloadButton.innerHTML = '<i class="fas fa-download"></i>'; // Icon
                downloadButton.onclick = (e) => {
                    e.stopPropagation();
                    downloadNoteWithExtension(note); // Panggil fungsi unduh dengan ekstensi
                }; 
                noteElement.appendChild(downloadButton);

                notesContainer.appendChild(noteElement);
            });
        }

        function deleteNote(index) {
            if (!confirm('Apakah Anda yakin ingin menghapus catatan ini?')) return;
            
            notesData.splice(index, 1);
            localStorage.setItem('notes', JSON.stringify(notesData));
            // Cek apakah catatan yang dihapus adalah yang sedang diedit
            if (index === editingIndex) {
                cancelEdit();
            } else if (index < editingIndex) {
                 // Jika yang dihapus sebelum indeks edit, geser indeks edit
                editingIndex--;
            }
            displayNotes();
        }

        function getCurrentTimestamp() {
            const now = new Date();
            return now.toLocaleString('id-ID', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        addNoteButton.addEventListener('click', () => {
            const title = noteTitleInput.value.trim();
            const content = noteContentInput.value.trim();
            
            if (title === "" || content === "") {
                alert("Judul dan isi catatan tidak boleh kosong.");
                return;
            }

            if (editingIndex !== -1) {
                // Mode Edit: Update catatan yang sudah ada
                notesData[editingIndex].title = title;
                notesData[editingIndex].content = content;
                // Optional: notesData[editingIndex].timestamp = getCurrentTimestamp(); untuk waktu update
                
                cancelEdit(); // Keluar dari mode edit

            } else {
                // Mode Tambah Baru: Buat catatan baru
                const timestamp = getCurrentTimestamp();
                notesData.push({
                    title,
                    content,
                    timestamp
                });
                
                noteTitleInput.value = '';
                noteContentInput.value = '';
            }

            localStorage.setItem('notes', JSON.stringify(notesData));
            displayNotes();
        });

        // PERBAIKAN: Fungsi Unduh dengan pilihan ekstensi (tanpa mengubah nama fungsi lama)
        function downloadNoteWithExtension(note) {
            // Prompt untuk ekstensi file
            let ext = prompt("Masukkan ekstensi file (misal: txt, md, log, json):", "txt");

            if (!ext || ext.trim() === "") {
                return; // Batalkan jika kosong
            }
            
            // Bersihkan ekstensi (hanya huruf dan angka)
            ext = ext.replace(/[^a-z0-9]/gi, '').toLowerCase();
            if (ext === "") ext = "txt"; // Default jika input dibersihkan menjadi kosong

            // Tentukan MIME type
            let mimeType = 'text/plain;charset=utf-8';
            if (ext === 'json') mimeType = 'application/json;charset=utf-8';
            else if (ext === 'md') mimeType = 'text/markdown;charset=utf-8';

            const fileContent = `
Judul Catatan: ${note.title}
----------------------------------------
Isi: 
${note.content}

----------------------------------------
Ditambahkan pada: ${note.timestamp}
`;
            const blob = new Blob([fileContent], { type: mimeType });
            const url = URL.createObjectURL(blob);

            const downloadLink = document.createElement('a');
            downloadLink.href = url;
            // Gunakan judul file yang aman untuk sistem file
            downloadLink.download = `${note.title.replace(/[^a-z0-9]/gi, '_')}.${ext}`; 
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(url); 
        }

        displayNotes();
    </script>

</body>

</html>
