<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NoteMaster Ultra</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font: Plus Jakarta Sans (Modern & Techy) -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- AutoAnimate (Untuk animasi layout halus) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/auto-animate/0.8.0/auto-animate.min.js"></script>

    <style>
        /* --- VARIABLES --- */
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --bg-color: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --card-bg: rgba(255, 255, 255, 0.65);
            --card-border: 1px solid rgba(255, 255, 255, 0.8);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
            --modal-bg: rgba(255, 255, 255, 0.9);
        }

        [data-theme="dark"] {
            --primary: #818cf8;
            --secondary: #c084fc;
            --accent: #f472b6;
            --bg-color: #0f172a;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: 1px solid rgba(255, 255, 255, 0.1);
            --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --modal-bg: rgba(15, 23, 42, 0.95);
        }

        * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            min-height: 100vh;
            color: var(--text-main);
            transition: background-color 0.5s ease;
            overflow-x: hidden;
            position: relative;
        }

        /* --- ANIMATED BACKGROUND --- */
        .ambient-light {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15), transparent 40%),
                        radial-gradient(circle at 100% 0%, rgba(168, 85, 247, 0.15), transparent 40%),
                        radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.15), transparent 40%),
                        radial-gradient(circle at 0% 100%, rgba(34, 211, 238, 0.15), transparent 40%);
            animation: breathe 10s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* --- LAYOUT --- */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 30px;
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 0 0 20px 20px;
            margin-top: -20px; /* Offset padding container */
            padding-left: 20px;
            padding-right: 20px;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .search-bar {
            position: relative;
            flex-grow: 1;
            max-width: 500px;
            margin: 0 20px;
            display: none; /* Mobile hidden initially */
        }
        
        @media(min-width: 768px) { .search-bar { display: block; } }

        .search-input {
            width: 100%;
            padding: 12px 20px 12px 45px;
            border-radius: 50px;
            border: 2px solid transparent;
            background: rgba(255, 255, 255, 0.1);
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            color: var(--text-main);
            font-size: 0.95rem;
            transition: all 0.3s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.2);
            background: var(--bg-color);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        /* --- MASONRY GRID --- */
        .notes-masonry {
            column-count: 1;
            column-gap: 20px;
            padding-bottom: 100px; /* Space for FAB */
        }

        @media (min-width: 640px) { .notes-masonry { column-count: 2; } }
        @media (min-width: 1024px) { .notes-masonry { column-count: 3; } }
        @media (min-width: 1280px) { .notes-masonry { column-count: 4; } }

        .note-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: var(--card-border);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px; /* Space for masonry */
            break-inside: avoid;
            box-shadow: var(--glass-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: default;
        }

        .note-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 20px 40px rgba(0,0,0,0.12);
            border-color: var(--primary);
            z-index: 2;
        }

        .note-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
            color: var(--text-main);
        }

        .note-content {
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
            white-space: pre-wrap;
            margin-bottom: 20px;
            max-height: 400px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .note-meta {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            opacity: 0.8;
            padding-top: 15px;
            border-top: 1px solid rgba(0,0,0,0.05);
        }

        /* Action Buttons on Card */
        .card-actions {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .note-card:hover .card-actions, .note-card:focus-within .card-actions {
            opacity: 1;
            transform: translateY(0);
        }

        .btn-mini {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--bg-color);
            color: var(--text-main);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        .btn-mini:hover { background: var(--primary); color: white; transform: scale(1.1); }
        .btn-mini.delete:hover { background: #ef4444; }

        /* --- FLOATING ACTION BUTTON (FAB) --- */
        .fab-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .fab {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            font-size: 28px;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fab:hover { transform: scale(1.1) rotate(90deg); box-shadow: 0 15px 35px rgba(99, 102, 241, 0.6); }

        .theme-toggle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--card-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--glass-shadow);
            transition: 0.3s;
        }
        .theme-toggle:hover { transform: rotate(180deg); background: var(--text-main); color: var(--bg-color); }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s;
        }

        .modal-overlay.active { opacity: 1; visibility: visible; }

        .modal {
            background: var(--modal-bg);
            width: 90%;
            max-width: 600px;
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.25);
            border: 1px solid rgba(255,255,255,0.1);
            transform: scale(0.8) translateY(20px);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.active .modal { transform: scale(1) translateY(0); }

        .modal h2 { margin: 0 0 20px; font-weight: 800; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .modal-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            margin-bottom: 15px;
            font-family: inherit;
        }

        .modal-title-input { font-size: 1.5rem; font-weight: 700; border-bottom: 2px solid rgba(0,0,0,0.1); padding-bottom: 10px; }
        .modal-title-input:focus { border-color: var(--primary); }
        
        .modal-content-input { font-size: 1rem; line-height: 1.6; min-height: 150px; resize: none; }

        .modal-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .color-palette { display: flex; gap: 10px; }
        .color-dot {
            width: 25px; height: 25px; border-radius: 50%; cursor: pointer;
            border: 2px solid transparent; transition: 0.2s; position: relative;
        }
        .color-dot.selected::after {
            content: '\f00c'; font-family: "Font Awesome 6 Free"; font-weight: 900;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: #333; font-size: 10px;
        }
        
        .btn-save {
            background: var(--primary); color: white; border: none;
            padding: 10px 25px; border-radius: 20px; font-weight: 600; cursor: pointer;
            box-shadow: 0 5px 15px rgba(99, 102, 241, 0.3); transition: 0.3s;
        }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(99, 102, 241, 0.5); }

        .close-modal {
            position: absolute; top: 20px; right: 20px;
            background: transparent; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-muted);
        }

        /* Color Themes for Cards */
        .theme-white { --card-bg: rgba(255,255,255,0.8); }
        .theme-blue { --card-bg: rgba(219, 234, 254, 0.9); }
        .theme-green { --card-bg: rgba(220, 252, 231, 0.9); }
        .theme-yellow { --card-bg: rgba(254, 249, 195, 0.9); }
        .theme-purple { --card-bg: rgba(243, 232, 255, 0.9); }

        [data-theme="dark"] .theme-white { --card-bg: rgba(30, 41, 59, 0.8); }
        [data-theme="dark"] .theme-blue { --card-bg: rgba(30, 58, 138, 0.6); }
        [data-theme="dark"] .theme-green { --card-bg: rgba(20, 83, 45, 0.6); }
        [data-theme="dark"] .theme-yellow { --card-bg: rgba(113, 63, 18, 0.6); }
        [data-theme="dark"] .theme-purple { --card-bg: rgba(88, 28, 135, 0.6); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding-top: 100px;
            grid-column: 1 / -1;
            color: var(--text-muted);
        }
        .empty-icon { font-size: 4rem; margin-bottom: 20px; opacity: 0.5; animation: float 3s infinite ease-in-out; }
        
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <!-- Ambient Background -->
    <div class="ambient-light"></div>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="logo"><i class="fas fa-bolt"></i> NoteMaster</div>
            <div class="search-bar">
                <i class="fas fa-search search-icon"></i>
                <input type="text" id="searchInput" class="search-input" placeholder="Temukan ide..." onkeyup="filterNotes()">
            </div>
        </header>

        <!-- Masonry Grid -->
        <div id="notesGrid" class="notes-masonry">
            <!-- Notes injected here -->
        </div>

        <!-- Floating Controls -->
        <div class="fab-container">
            <button class="theme-toggle" onclick="toggleTheme()" title="Ganti Tema">
                <i class="fas fa-moon"></i>
            </button>
            <button class="fab" onclick="openModal()" title="Tambah Catatan Baru">
                <i class="fas fa-plus"></i>
            </button>
        </div>
    </div>

    <!-- Modal Form -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <button class="close-modal" onclick="closeModal()"><i class="fas fa-times"></i></button>
            <h2 id="modalTitleLabel">Catatan Baru</h2>
            
            <input type="text" id="noteTitle" class="modal-input modal-title-input" placeholder="Judul..." autocomplete="off">
            <textarea id="noteContent" class="modal-input modal-content-input" placeholder="Tulis sesuatu yang hebat di sini..."></textarea>
            
            <div class="modal-footer">
                <div class="color-palette">
                    <div class="color-dot theme-white selected" style="background: #f1f5f9;" onclick="selectColor('theme-white', this)"></div>
                    <div class="color-dot theme-blue" style="background: #bfdbfe;" onclick="selectColor('theme-blue', this)"></div>
                    <div class="color-dot theme-green" style="background: #bbf7d0;" onclick="selectColor('theme-green', this)"></div>
                    <div class="color-dot theme-yellow" style="background: #fef08a;" onclick="selectColor('theme-yellow', this)"></div>
                    <div class="color-dot theme-purple" style="background: #e9d5ff;" onclick="selectColor('theme-purple', this)"></div>
                </div>
                <button class="btn-save" onclick="saveNote()">Simpan <i class="fas fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        // === STATE ===
        let notes = JSON.parse(localStorage.getItem('notes_ultimate')) || [];
        let editingId = null;
        let selectedTheme = 'theme-white';
        let isDark = localStorage.getItem('theme') === 'dark';

        // === INIT ===
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('notesGrid');
            if(window.autoAnimate) autoAnimate(grid); // Aktifkan animasi layout
            
            applyTheme(isDark);
            renderNotes();
        });

        // === CORE FUNCTIONS ===

        function renderNotes(filterText = '') {
            const grid = document.getElementById('notesGrid');
            grid.innerHTML = '';

            const filtered = notes.filter(n => 
                n.title.toLowerCase().includes(filterText.toLowerCase()) || 
                n.content.toLowerCase().includes(filterText.toLowerCase())
            );

            // Sort: Terbaru di atas (berdasarkan pin lalu waktu update)
            filtered.sort((a, b) => {
                if (a.pinned !== b.pinned) return b.pinned ? 1 : -1;
                return new Date(b.updatedAt) - new Date(a.updatedAt);
            });

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-meteor empty-icon"></i>
                        <h3>Belum ada catatan</h3>
                        <p>Tekan tombol + untuk memulai ide baru.</p>
                    </div>`;
                return;
            }

            filtered.forEach(note => {
                const div = document.createElement('div');
                div.className = `note-card ${note.color || 'theme-white'}`;
                
                // Format Relative Time
                const timeAgo = getRelativeTime(new Date(note.updatedAt));

                div.innerHTML = `
                    <div class="card-actions">
                        <button class="btn-mini" onclick="togglePin(${note.id})" title="${note.pinned ? 'Lepas Pin' : 'Pin'}">
                            <i class="fas fa-thumbtack" style="${note.pinned ? 'color: var(--primary); transform: rotate(45deg);' : ''}"></i>
                        </button>
                        <button class="btn-mini" onclick="editNote(${note.id})" title="Edit"><i class="fas fa-pen"></i></button>
                        <button class="btn-mini delete" onclick="deleteNote(${note.id})" title="Hapus"><i class="fas fa-trash"></i></button>
                    </div>
                    ${note.pinned ? '<i class="fas fa-thumbtack" style="position:absolute; top:25px; left:25px; color:var(--primary); opacity:0.8; font-size:0.8rem;"></i>' : ''}
                    <div style="${note.pinned ? 'margin-top: 15px;' : ''}">
                        <h3 class="note-title">${escapeHtml(note.title)}</h3>
                        <div class="note-content">${formatContent(note.content)}</div>
                    </div>
                    <div class="note-meta">
                        <span>${timeAgo}</span>
                        <span>${note.content.length} chars</span>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const content = document.getElementById('noteContent').value.trim();

            if (!title && !content) {
                Swal.fire({icon: 'warning', title: 'Ups!', text: 'Catatan tidak boleh kosong.', timer: 1500, showConfirmButton: false});
                return;
            }

            if (editingId) {
                // Update
                const idx = notes.findIndex(n => n.id === editingId);
                if (idx > -1) {
                    notes[idx].title = title;
                    notes[idx].content = content;
                    notes[idx].color = selectedTheme;
                    notes[idx].updatedAt = new Date().toISOString();
                }
            } else {
                // Create
                notes.push({
                    id: Date.now(),
                    title: title || 'Tanpa Judul',
                    content: content,
                    color: selectedTheme,
                    pinned: false,
                    createdAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
            }

            saveToLocal();
            renderNotes();
            closeModal();
            Swal.fire({icon: 'success', title: 'Tersimpan!', toast: true, position: 'top-end', showConfirmButton: false, timer: 1500});
        }

        function deleteNote(id) {
            Swal.fire({
                title: 'Hapus?',
                text: "Tidak bisa dikembalikan lho!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#ef4444',
                confirmButtonText: 'Ya, buang!',
                background: isDark ? '#1e293b' : '#fff',
                color: isDark ? '#fff' : '#333'
            }).then((result) => {
                if (result.isConfirmed) {
                    notes = notes.filter(n => n.id !== id);
                    saveToLocal();
                    renderNotes();
                }
            });
        }

        function editNote(id) {
            const note = notes.find(n => n.id === id);
            if (!note) return;

            editingId = id;
            document.getElementById('modalTitleLabel').innerText = 'Edit Catatan';
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            selectColor(note.color || 'theme-white');
            
            openModal();
        }

        function togglePin(id) {
            const idx = notes.findIndex(n => n.id === id);
            if (idx > -1) {
                notes[idx].pinned = !notes[idx].pinned;
                saveToLocal();
                renderNotes();
            }
        }

        // === UI HELPERS ===

        function openModal() {
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('noteTitle').focus();
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            setTimeout(() => {
                editingId = null;
                document.getElementById('noteTitle').value = '';
                document.getElementById('noteContent').value = '';
                document.getElementById('modalTitleLabel').innerText = 'Catatan Baru';
                selectColor('theme-white');
            }, 300);
        }

        // Close modal on outside click
        document.getElementById('modalOverlay').addEventListener('click', (e) => {
            if(e.target === document.getElementById('modalOverlay')) closeModal();
        });

        function selectColor(colorClass, element = null) {
            selectedTheme = colorClass;
            document.querySelectorAll('.color-dot').forEach(el => el.classList.remove('selected'));
            if(element) {
                element.classList.add('selected');
            } else {
                // Find by class logic
                const els = document.querySelectorAll('.color-dot');
                // Simple mapping for programmatic selection
                if(colorClass.includes('white')) els[0].classList.add('selected');
                else if(colorClass.includes('blue')) els[1].classList.add('selected');
                else if(colorClass.includes('green')) els[2].classList.add('selected');
                else if(colorClass.includes('yellow')) els[3].classList.add('selected');
                else if(colorClass.includes('purple')) els[4].classList.add('selected');
            }
        }

        function toggleTheme() {
            isDark = !isDark;
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            applyTheme(isDark);
        }

        function applyTheme(dark) {
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            const btn = document.querySelector('.theme-toggle i');
            btn.className = dark ? 'fas fa-sun' : 'fas fa-moon';
        }

        function filterNotes() {
            renderNotes(document.getElementById('searchInput').value);
        }

        function saveToLocal() {
            localStorage.setItem('notes_ultimate', JSON.stringify(notes));
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function formatContent(text) {
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function getRelativeTime(date) {
            const now = new Date();
            const diffInSeconds = Math.floor((now - date) / 1000);
            
            if (diffInSeconds < 60) return 'Baru saja';
            if (diffInSeconds < 3600) return `${Math.floor(diffInSeconds / 60)} menit lalu`;
            if (diffInSeconds < 86400) return `${Math.floor(diffInSeconds / 3600)} jam lalu`;
            return date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' });
        }
    </script>
</body>
</html>
